name: develsystems_qr_orders
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.3
  go_router: ^14.2.7
  dio: ^5.7.0
  flutter_dotenv: ^5.2.0
  sqflite: ^2.4.1
  path: ^1.9.0
  uuid: ^4.5.1
  intl: ^0.19.0
  connectivity_plus: ^6.1.0
  qr_bridge:
    path: plugin/qr_bridge

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.3
  sqflite_common_ffi: ^2.3.3
  rename_app: ^1.6.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/qr/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logos/Dsystems.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/Dsystems.png"

flutter_native_splash:
  color: "#FFFFFF" 
  image: "assets/logos/color_logo.png"
  android_12:
    image: "assets/logos/Dsystems.png"
    color: "#FFFFFF"